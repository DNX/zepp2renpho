[project]
name = "zepp2renpho"
version = "0.1.0"
description = "Move scale history, family members included, from Zepp to RENPHO Health."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Bertini" }]
requires-python = ">=3.11"
keywords = ["zepp", "amazfit", "zepp-life", "renpho", "smart-scale", "body-composition", "export", "import"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "renpho-py>=0.4",
]

[project.urls]
Homepage = "https://github.com/WaYdotNET/zepp2renpho"
Issues = "https://github.com/WaYdotNET/zepp2renpho/issues"

[project.scripts]
zepp-export = "zepp2renpho.zepp_cli:main"
renpho-import = "zepp2renpho.renpho_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
